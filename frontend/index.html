<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workout Wellness</title>
  <style>
    :root {
      --panel: #181818;
      --panel2: #1f1f1f;
      --border: #3a3a3a;
      --lime: #d4ff2b;
      --cyan: #3ee6e6;
      --pink: #ff2ea6;
      --text: #f5f5f5;
      --muted: #a8a8b0;
    }

    * {
      box-sizing: border-box
    }

    body {
      margin: 0;
      background: #000;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow-x: hidden
    }

    a {
      color: inherit;
      text-decoration: none;
      cursor: pointer
    }

    /* ---- FitTrackBackground, ported 1:1 from the supplied React/Framer Motion
   component into plain CSS + HTML. This app has no React runtime (it's a
   single vanilla HTML/JS file), so framer-motion/lucide-react can't be
   imported directly — every motion.div animate={{...}} call below has been
   translated into an equivalent CSS @keyframes rule with the same duration,
   delay and easing, and the six lucide icons were redrawn as inline SVGs
   (stroke=currentColor, size 22, strokeWidth 1.1) so nothing depends on an
   external icon/library CDN ever failing to load. Visual result is the same
   fixed, non-blocking background with rings, dot streams, hex clusters,
   side lines, pulsing points and floating fitness-icon circles. */
    body {
      margin: 0;
      background: #010101;
      color: var(--text);
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      overflow-x: hidden;
      scroll-behavior: smooth
    }

    a {
      color: inherit;
      text-decoration: none;
      cursor: pointer
    }

    ::-webkit-scrollbar {
      width: 7px
    }

    ::-webkit-scrollbar-track {
      background: #030403
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(150, 170, 70, .45);
      border-radius: 20px
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(170, 195, 80, .7)
    }

    .fittrack-background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100vh;
      overflow: hidden;
      z-index: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, #181b13 0%, #0e100c 30%, #070807 62%, #010101 100%)
    }

    .fittrack-background::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: radial-gradient(ellipse at center, rgba(157, 181, 63, .075), transparent 48%)
    }

    /* curved lines */
    .ring {
      position: absolute;
      top: -22%;
      height: 145%;
      border-radius: 50%;
      will-change: transform
    }

    .ring-left-1 {
      left: -47%;
      width: 61%;
      border-right: 1px solid rgba(145, 155, 125, .38);
      animation: ringLeft1 12s ease-in-out infinite
    }

    .ring-left-2 {
      left: -44%;
      width: 55%;
      border-right: 1.5px solid rgba(175, 195, 78, .62);
      animation: ringLeft2 10s ease-in-out infinite
    }

    .ring-left-3 {
      left: -41%;
      width: 49%;
      border-right: 1px solid rgba(135, 145, 115, .34);
      animation: ringLeft3 14s ease-in-out infinite
    }

    .ring-right-1 {
      right: -47%;
      width: 61%;
      border-left: 1px solid rgba(145, 155, 125, .38);
      animation: ringRight1 12s ease-in-out infinite
    }

    .ring-right-2 {
      right: -44%;
      width: 55%;
      border-left: 1.5px solid rgba(175, 195, 78, .62);
      animation: ringRight2 10s ease-in-out infinite
    }

    .ring-right-3 {
      right: -41%;
      width: 49%;
      border-left: 1px solid rgba(135, 145, 115, .34);
      animation: ringRight3 14s ease-in-out infinite
    }

    @keyframes ringLeft1 {

      0%,
      100% {
        transform: translateX(0) rotate(-9deg)
      }

      50% {
        transform: translateX(4px) rotate(-8.6deg)
      }
    }

    @keyframes ringLeft2 {

      0%,
      100% {
        transform: translateX(0) rotate(-9deg)
      }

      50% {
        transform: translateX(5px) rotate(-8.5deg)
      }
    }

    @keyframes ringLeft3 {

      0%,
      100% {
        transform: translateX(0) rotate(-9deg)
      }

      50% {
        transform: translateX(3px) rotate(-9deg)
      }
    }

    @keyframes ringRight1 {

      0%,
      100% {
        transform: translateX(0) rotate(9deg)
      }

      50% {
        transform: translateX(-4px) rotate(8.6deg)
      }
    }

    @keyframes ringRight2 {

      0%,
      100% {
        transform: translateX(0) rotate(9deg)
      }

      50% {
        transform: translateX(-5px) rotate(8.5deg)
      }
    }

    @keyframes ringRight3 {

      0%,
      100% {
        transform: translateX(0) rotate(9deg)
      }

      50% {
        transform: translateX(-3px) rotate(9deg)
      }
    }

    /* outer curves */
    .outer-curve {
      position: absolute;
      top: -15%;
      width: 32%;
      height: 130%;
      border-radius: 50%
    }

    .outer-curve.left {
      left: -22%;
      border-right: 1px solid rgba(115, 125, 105, .22);
      animation: outerLeft 13s ease-in-out infinite
    }

    .outer-curve.right {
      right: -22%;
      border-left: 1px solid rgba(115, 125, 105, .22);
      animation: outerRight 13s ease-in-out infinite
    }

    @keyframes outerLeft {

      0%,
      100% {
        transform: translateX(0) rotate(-7deg)
      }

      50% {
        transform: translateX(3px) rotate(-7deg)
      }
    }

    @keyframes outerRight {

      0%,
      100% {
        transform: translateX(0) rotate(7deg)
      }

      50% {
        transform: translateX(-3px) rotate(7deg)
      }
    }

    /* continuous moving dots, top-to-bottom, seamless loop */
    .dot-stream {
      position: absolute;
      width: 120px;
      height: 100vh;
      overflow: hidden;
      opacity: .45
    }

    .dot-stream-left {
      left: 6%;
      top: 0
    }

    .dot-stream-right {
      right: 6%;
      top: 0
    }

    .dot-pattern {
      position: absolute;
      width: 120px;
      height: 200%;
      background-image: radial-gradient(circle, rgba(183, 205, 83, .65) 1px, transparent 1.5px);
      background-size: 17px 17px;
      filter: drop-shadow(0 0 2px rgba(166, 190, 70, .25));
      animation: dotFlow 6s linear infinite
    }

    @keyframes dotFlow {
      from {
        transform: translateY(-50%)
      }

      to {
        transform: translateY(0%)
      }
    }

    /* hexagon pattern */
    .hex-group {
      position: absolute;
      width: 125px;
      height: 240px;
      opacity: .18
    }

    .hex-left {
      left: -65px;
      top: 6%;
      animation: hexLeft 9s ease-in-out infinite
    }

    .hex-right {
      right: -65px;
      top: 6%;
      animation: hexRight 9s ease-in-out infinite
    }

    @keyframes hexLeft {

      0%,
      100% {
        transform: translateY(0);
        opacity: .12
      }

      50% {
        transform: translateY(-6px);
        opacity: .2
      }
    }

    @keyframes hexRight {

      0%,
      100% {
        transform: translateY(0);
        opacity: .12
      }

      50% {
        transform: translateY(6px);
        opacity: .2
      }
    }

    .hex {
      position: absolute;
      width: 41px;
      height: 47px;
      border: 1px solid rgba(130, 140, 120, .5);
      clip-path: polygon(25% 0%, 75% 0%, 100% 50%, 75% 100%, 25% 100%, 0% 50%)
    }

    .hex:nth-child(1) {
      left: 0;
      top: 0
    }

    .hex:nth-child(2) {
      left: 37px;
      top: 0
    }

    .hex:nth-child(3) {
      left: 18px;
      top: 34px
    }

    .hex:nth-child(4) {
      left: 55px;
      top: 34px
    }

    .hex:nth-child(5) {
      left: 37px;
      top: 68px
    }

    .hex:nth-child(6) {
      left: 74px;
      top: 68px
    }

    /* side lines */
    .side-decoration {
      position: absolute;
      top: 0;
      width: 70px;
      height: 100%;
      opacity: .42
    }

    .side-left {
      left: -37px;
      animation: sideLeft 6s ease-in-out infinite
    }

    .side-right {
      right: -37px;
      animation: sideRight 6s ease-in-out infinite
    }

    @keyframes sideLeft {

      0%,
      100% {
        transform: translateX(0);
        opacity: .25
      }

      50% {
        transform: translateX(3px);
        opacity: .48
      }
    }

    @keyframes sideRight {

      0%,
      100% {
        transform: translateX(0);
        opacity: .25
      }

      50% {
        transform: translateX(-3px);
        opacity: .48
      }
    }

    .side-decoration span {
      position: absolute;
      width: 92px;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(158, 181, 78, .82), transparent)
    }

    .side-decoration span:nth-child(1) {
      top: 8%;
      transform: rotate(43deg)
    }

    .side-decoration span:nth-child(2) {
      top: 30%;
      transform: rotate(-43deg)
    }

    .side-decoration span:nth-child(3) {
      top: 70%;
      transform: rotate(43deg)
    }

    .side-decoration span:nth-child(4) {
      top: 92%;
      transform: rotate(-43deg)
    }

    /* small green points */
    .green-point {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #aec655;
      box-shadow: 0 0 7px rgba(174, 198, 85, .8);
      animation: pointPulse 2.5s ease-in-out infinite
    }

    .point-1 {
      left: 3%;
      top: 34%;
      animation-delay: .4s
    }

    .point-2 {
      left: 5%;
      top: 57%;
      animation-delay: .8s
    }

    .point-3 {
      right: 3%;
      top: 34%;
      animation-delay: 1.2s
    }

    .point-4 {
      right: 5%;
      top: 57%;
      animation-delay: 1.6s
    }

    @keyframes pointPulse {

      0%,
      100% {
        transform: scale(1);
        opacity: .4
      }

      50% {
        transform: scale(1.6);
        opacity: .9
      }
    }

    /* ---- middle-of-page additions (same visual language as the edge decor) ---- */
    /* center radar/pulse rings — a slow sonar-style ping, evokes a heart-rate/goal target */
    .center-pulse {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0
    }

    .pulse-ring {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 180px;
      height: 180px;
      margin: -90px 0 0 -90px;
      border-radius: 50%;
      border: 1px solid rgba(212, 255, 43, .35);
      opacity: 0;
      animation: pulseRing 4.5s ease-out infinite
    }

    .pulse-ring:nth-child(2) {
      animation-delay: 1.5s;
      border-color: rgba(62, 230, 230, .3)
    }

    .pulse-ring:nth-child(3) {
      animation-delay: 3s
    }

    @keyframes pulseRing {
      0% {
        transform: scale(.4);
        opacity: .55
      }

      80% {
        opacity: 0
      }

      100% {
        transform: scale(1.15);
        opacity: 0
      }
    }

    /* small center hex micro-cluster, lower half of the page */
    .hex-center {
      position: absolute;
      left: 50%;
      margin-left: -56px;
      top: 58%;
      width: 112px;
      height: 80px;
      opacity: .1;
      animation: hexCenter 11s ease-in-out infinite
    }

    .hex-center .hex {
      width: 35px;
      height: 40px
    }

    .hex-center .hex:nth-child(1) {
      left: 0;
      top: 0
    }

    .hex-center .hex:nth-child(2) {
      left: 38px;
      top: 20px
    }

    .hex-center .hex:nth-child(3) {
      left: 76px;
      top: 0
    }

    @keyframes hexCenter {

      0%,
      100% {
        transform: translateY(0);
        opacity: .08
      }

      50% {
        transform: translateY(-5px);
        opacity: .16
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .pulse-ring,
      .hex-center {
        animation: none !important
      }
    }

    /* fitness icon circles */
    .fitness-icon {
      position: absolute;
      z-index: 8;
      width: 52px;
      height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      color: #747a70;
      background: radial-gradient(circle, #191c17 0%, #0b0d0a 58%, #010201 100%);
      border: 1px solid rgba(130, 140, 120, .48);
      box-shadow: 0 0 0 2px rgba(0, 0, 0, .9), 0 0 0 3px rgba(145, 170, 62, .14), inset 0 0 16px rgba(0, 0, 0, .95);
      opacity: 0;
      animation: iconFadeIn .7s ease forwards, iconFloat 4s ease-in-out infinite;
      transition: transform .25s ease, color .25s ease;
      pointer-events: auto
    }

    .fitness-icon:hover {
      transform: scale(1.15);
      color: #b4ca5d
    }

    .fitness-icon::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      border: 1px solid rgba(160, 184, 70, .52);
      border-top-color: transparent;
      border-bottom-color: transparent;
      transform: rotate(28deg)
    }

    .fitness-icon::after {
      content: "";
      position: absolute;
      inset: 5px;
      border-radius: 50%;
      border: 1px dashed rgba(120, 130, 110, .15)
    }

    .fitness-icon svg {
      width: 22px;
      height: 22px;
      position: relative
    }

    @keyframes iconFadeIn {
      from {
        opacity: 0;
        transform: scale(.7)
      }

      to {
        opacity: 1;
        transform: scale(1)
      }
    }

    @keyframes iconFloat {

      0%,
      100% {
        transform: scale(1) translateY(0)
      }

      50% {
        transform: scale(1.04) translateY(-4px)
      }
    }

    @media(max-width:900px) {
      .fitness-icon {
        width: 46px;
        height: 46px
      }

      .fitness-icon svg {
        width: 20px;
        height: 20px
      }

      .dot-stream {
        transform: scale(.8)
      }
    }

    @media(max-width:600px) {
      .fitness-icon {
        width: 40px;
        height: 40px
      }

      .fitness-icon svg {
        width: 17px;
        height: 17px
      }

      .dot-stream {
        transform: scale(.65)
      }

      .hex-group {
        opacity: .08
      }

      .ring,
      .outer-curve {
        opacity: .55
      }

      .side-decoration {
        opacity: .2
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .ring,
      .outer-curve,
      .dot-pattern,
      .hex-left,
      .hex-right,
      .side-left,
      .side-right,
      .green-point,
      .fitness-icon {
        animation: none !important
      }
    }

    header.nav,
    main,
    .toast {
      position: relative;
      z-index: 1
    }

    header.nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 26px;
      border-bottom: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 10px;
      backdrop-filter: blur(10px);
      background: rgba(8, 8, 8, 0.6)
    }

    .logo {
      font-weight: 800;
      font-size: 18px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, .7)
    }

    .logo span {
      color: var(--lime)
    }

    .navlinks {
      display: flex;
      gap: 14px;
      font-size: 11px;
      letter-spacing: .4px;
      color: var(--muted);
      font-weight: 600;
      flex-wrap: wrap;
      overflow-x: auto
    }

    .navlinks a {
      padding: 6px 0;
      border-bottom: 2px solid transparent;
      text-shadow: 0 1px 6px rgba(0, 0, 0, .7);
      white-space: nowrap
    }

    .navlinks a.active {
      color: var(--text);
      border-color: var(--lime)
    }

    .navright {
      display: flex;
      align-items: center;
      gap: 10px;
      text-shadow: 0 1px 6px rgba(0, 0, 0, .7)
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #333;
      border: 2px solid var(--lime)
    }

    .pill {
      font-size: 9px;
      color: var(--lime);
      font-weight: 700
    }

    main {
      padding: 22px 26px 60px;
      max-width: 1200px;
      margin: 0 auto
    }

    h1 {
      font-size: 26px;
      margin: 0 0 6px;
      text-shadow: 0 2px 16px rgba(0, 0, 0, .85)
    }

    .sub {
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 18px;
      text-shadow: 0 1px 8px rgba(0, 0, 0, .75)
    }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .5)
    }

    .stat-card {
      border-left: 3px solid var(--lime);
      border-radius: 12px;
      background: var(--panel);
      padding: 14px 16px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, .45)
    }

    .stat-card.cyan {
      border-left-color: var(--cyan)
    }

    .stat-card.pink {
      border-left-color: var(--pink)
    }

    .stat-card .label {
      font-size: 10px;
      color: var(--muted);
      letter-spacing: .5px;
      margin-bottom: 4px
    }

    .stat-card .value {
      font-size: 20px;
      font-weight: 800
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: var(--lime);
      color: #111;
      font-weight: 700;
      padding: 11px 18px;
      border-radius: 10px;
      border: none;
      cursor: pointer;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(212, 255, 43, .3)
    }

    .btn.secondary {
      background: var(--panel2);
      color: var(--text);
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0, 0, 0, .4);

    }

    .btn:disabled {
      opacity: .4;
      cursor: not-allowed
    }

    .badge {
      font-size: 9px;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 20px;
      background: #2a2a2a;
      color: var(--muted);
      letter-spacing: .5px;

      height: 23px;
    }

    .badge.lime {
      background: var(--lime);
      color: #111
    }

    .tag {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: .3px
    }

    .progress-track {
      height: 6px;
      background: #2a2a2a;
      border-radius: 6px;
      overflow: hidden
    }

    .progress-fill {
      height: 100%;
      background: var(--lime)
    }

    .grid {
      display: grid;
      gap: 14px
    }

    .two-col {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 18px
    }

    .row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--muted);
      padding: 6px 0;
      border-bottom: 1px solid var(--border)
    }

    .row span.v {
      color: var(--text);
      font-weight: 600
    }

    .chip {
      padding: 7px 14px;
      border-radius: 20px;
      background: var(--panel2);
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      border: 1px solid var(--border)
    }

    .chip.active {
      background: var(--lime);
      color: #111;
      border-color: var(--lime)
    }

    .exercise-card {
      border-radius: 14px;
      overflow: hidden;
      background: var(--panel2);
      border: 1px solid var(--border);
      box-shadow: 0 8px 26px rgba(0, 0, 0, .5)
    }

    .exercise-img {
      height: 110px;
      background: linear-gradient(135deg, #2a2a2a, #161616);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative
    }

    .playbtn {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--lime);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      color: #111;
      font-weight: 700
    }

    .exercise-body {
      padding: 14px
    }

    .toast {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--lime);
      color: #111;
      padding: 12px 20px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, .4);
      opacity: 0;
      transform: translateY(10px);
      transition: .25s;
      z-index: 99;
      max-width: 320px
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0)
    }

    .section {
      display: none
    }

    .section.active {
      display: block
    }

    h2 {
      font-size: 18px;
      text-shadow: 0 2px 12px rgba(0, 0, 0, .8)
    }

    input[type=text],
    input[type=email],
    input[type=password],
    input[type=number] {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 14px;
      width: 100%
    }

    label {
      font-size: 11px;
      color: var(--muted);
      display: block;
      margin-bottom: 6px
    }

    .note {
      font-size: 11px;
      color: var(--cyan);
      background: rgba(20, 20, 20, .55);
      border: 1px solid rgba(62, 230, 230, .3);
      padding: 10px 14px;
      border-radius: 10px;
      margin-bottom: 16px
    }

    .warn {
      font-size: 11px;
      color: var(--pink);
      background: rgba(20, 20, 20, .55);
      border: 1px solid rgba(255, 46, 166, .3);
      padding: 8px 12px;
      border-radius: 8px;
      margin-top: 8px
    }

    .rec {

    function startSession(exId, name, video, totalSets, targetReps) {

    // Iframes fire `onload` even when their request is silently blocked (by a
    // proxy, CSP, or offline network) — so onload can't tell us whether the
    // video actually rendered. An <img> pointed at the same video CDN DOES
    // fire a real `onerror` on a blocked/failed request (this is what already
    // powers the thumbnail fallback chain), so it doubles as a reliable
    // reachability probe: only mount the real inline YouTube player once we
    // know that CDN is actually reachable. If it isn't, we skip the iframe
    // entirely and show a clean fallback instead of a broken/blank embed.
    function probeMediaReachability(sess) {
      if (!sess || !sess.video) return;
      const testUrl = thumbFromVideo(sess.video);
      if (!testUrl) { sess.mediaReachable = false; if (session === sess) renderWorkoutSession(); return; }
      const img = new Image();
      let settled = false;
      const finish = (ok) => {
        if (settled) return; settled = true;
        sess.mediaReachable = ok;
        if (session === sess) renderWorkoutSession();
      };
      const timer = setTimeout(() => finish(false), 5000);
      img.onload = () => { clearTimeout(timer); finish(true); };
      img.onerror = () => { clearTimeout(timer); finish(false); };
      img.src = testUrl;
    }

    <div class="two-col">
      <div class="card"><div style="display:flex;justify-content:space-between"><div class="tag">HEART RATE</div><a onclick="editHeartRate()" style="font-size:11px;color:var(--cyan);font-weight:700">EDIT</a></div><div style="font-size:24px;font-weight:800">${currentUser.stats.heartRate} BPM</div></div>
      <div class="card"><div class="tag">EXERCISE MIN TODAY</div><div style="font-size:24px;font-weight:800">${currentUser.stats.exerciseMin}</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="font-weight:700;font-size:16px;margin-bottom:6px">Health Profile</div>
      <p class="tag" style="margin-bottom:14px">General safety guidance, not medical advice — consult a healthcare provider for anything specific to you.</p>
      <label>FITNESS LEVEL</label>
      <div style="display:flex;gap:8px;margin-bottom:14px" id="levelChips">
        ${['beginner', 'intermediate', 'advanced'].map(l => `<div class="chip ${currentUser.fitnessLevel === l ? 'active' : ''}" data-l="${l}">${l}</div>`).join('')}
      </div>
      <label>HEALTH CONDITIONS</label>
      <div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px;margin-bottom:14px" id="condChecks">
        ${CONDITIONS.map(c => `<label style="display:flex;gap:6px;align-items:center;background:var(--panel2);border:1px solid var(--border);border-radius:8px;padding:8px 10px;cursor:pointer;font-size:12px">
          <input type="checkbox" data-c="${c.key}" ${currentUser.conditions.includes(c.key) ? 'checked' : ''}> ${c.label}</label>`).join('')}
      </div>
      <button class="btn" onclick="saveHealthProfile()">Save Health Profile</button>
    </div>`;
      document.querySelectorAll('#levelChips .chip').forEach(chip => { chip.onclick = () => { currentUser.fitnessLevel = chip.dataset.l; render.health(); }; });
    };
    window.saveHealthProfile = () => {
      currentUser.conditions = Array.from(document.querySelectorAll('#condChecks input:checked')).map(el => el.dataset.c);
      toast('Health profile saved — Workout recommendations updated');
    };
    window.editHeartRate = () => {
      const val = prompt('Enter your resting heart rate (BPM):', currentUser.stats.heartRate);
      if (val === null) return;
      const hr = parseInt(val);
      if (isNaN(hr) || hr < 0) { toast('Enter a valid number'); return; }
      currentUser.stats.heartRate = hr;
      toast('Heart rate updated');
      render.health();
    };

    let historyRange = 'daily';
    function isSameDay(a, b) { return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate(); }
    function startOfWeek(d) { const x = new Date(d); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0, 0, 0, 0); return x; }
    function filterHistory(range) {
      const now = new Date();
      const list = (currentUser.history || []).filter(h => typeof h.ts === 'number');
      if (range === 'daily') return list.filter(h => isSameDay(new Date(h.ts), now));
      if (range === 'weekly') { const start = startOfWeek(now); return list.filter(h => new Date(h.ts) >= start); }
      if (range === 'monthly') { return list.filter(h => { const d = new Date(h.ts); return d.getFullYear() === now.getFullYear() && d.getMonth() === now.getMonth(); }); }
      return list;
    }
    render.progress = () => {
      if (!currentUser) return authGate('sec-progress');
      document.getElementById('sec-progress').innerHTML = `
    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px">
      <div><h1>Performance Analytics</h1><p class="sub">Workout History is written only when you Sync.</p></div>
      <button class="btn secondary" onclick="exportData()">Export Data</button>
    </div>
    <div class="two-col">
      <div class="card"><div style="font-weight:700;font-size:15px;margin-bottom:8px">Total Workouts</div><div style="font-size:32px;font-weight:800">${currentUser.totalWorkouts}</div></div>
      <div class="card"><div style="font-weight:700;font-size:15px;margin-bottom:8px">Lifetime Calories</div><div style="font-size:32px;font-weight:800">${currentUser.stats.caloriesBurned}</div></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
        <b style="font-size:14px">Workout History</b>
        <div style="display:flex;gap:6px" id="rangeChips">
          <div class="chip ${historyRange === 'daily' ? 'active' : ''}" data-r="daily">DAILY</div>
          <div class="chip ${historyRange === 'weekly' ? 'active' : ''}" data-r="weekly">WEEKLY</div>
          <div class="chip ${historyRange === 'monthly' ? 'active' : ''}" data-r="monthly">MONTHLY</div>
        </div>
      </div>
      <div class="grid" style="grid-template-columns:repeat(4,1fr);margin-top:14px" id="rangeStats"></div>
      <div style="margin-top:14px" id="rangeList"></div>
    </div>`;
      document.querySelectorAll('#rangeChips .chip').forEach(chip => { chip.onclick = () => { historyRange = chip.dataset.r; render.progress(); }; });
      renderHistoryRange();
    };
    function renderHistoryRange() {
      const items = filterHistory(historyRange);
      const totalMin = items.reduce((s, h) => s + (h.minutes || 0), 0);
      const totalReps = items.reduce((s, h) => s + (h.reps || 0), 0);
      const totalCal = items.reduce((s, h) => s + (h.calories || 0), 0);
      const rangeLabel = historyRange === 'daily' ? 'Today' : historyRange === 'weekly' ? 'This Week' : 'This Month';
      document.getElementById('rangeStats').innerHTML = `
    <div class="stat-card"><div class="label">WORKOUTS · ${rangeLabel.toUpperCase()}</div><div class="value">${items.length}</div></div>
    <div class="stat-card cyan"><div class="label">DURATION</div><div class="value">${totalMin} min</div></div>
    <div class="stat-card pink"><div class="label">REPS LOGGED</div><div class="value">${totalReps}</div></div>
    <div class="stat-card"><div class="label">CALORIES</div><div class="value">${totalCal} kcal</div></div>`;
      document.getElementById('rangeList').innerHTML = items.length
        ? items.map(h => `<div class="row"><span>${h.name}</span><span class="v">${h.reps} reps · ${h.minutes} min · ${h.calories || 0} kcal · ${h.when}</span></div>`).join('')
        : `<div class="tag" style="padding:20px 0;text-align:center">No workouts synced for ${rangeLabel.toLowerCase()} yet — go to Workout, complete a session, then Sync to Dashboard.</div>`;
    }
    window.exportData = () => {
      const blob = new Blob([JSON.stringify(currentUser, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'fittrack-data.json';
      document.body.appendChild(a); a.click(); a.remove();
      toast('Data exported');
    };

    let authTab = 'signup';
    render.profile = () => {
      if (currentUser) {
        document.getElementById('sec-profile').innerHTML = `
      <div style="max-width:700px;margin:0 auto">
        <div class="card" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px">
          <div style="display:flex;gap:16px;align-items:center">
            <div style="width:64px;height:64px;border-radius:50%;background:#333;border:2px solid var(--lime)"></div>
            <div><div style="font-size:19px;font-weight:800">${currentUser.name}</div><div class="tag">${currentUser.email}</div>
              <div style="display:flex;gap:16px;margin-top:6px"><div><div class="tag">WORKOUTS</div><b>${currentUser.totalWorkouts}</b></div><div><div class="tag">CALORIES</div><b>${currentUser.stats.caloriesBurned}</b></div></div>
            </div>
          </div>
          <button class="btn secondary" onclick="editProfile()">Edit Profile</button>
        </div>
        <div class="card" style="margin-top:14px">
          <b>Account Settings</b>
          <div class="row" style="margin-top:10px">Fitness Level<span class="v">${currentUser.fitnessLevel}</span></div>
          <div class="row" style="border-bottom:none">Health Conditions<span class="v">${currentUser.conditions.length ? currentUser.conditions.length + ' set' : 'None'}</span></div>
        </div>
        <button class="btn secondary" style="width:100%;margin-top:14px;color:#ff5c5c" onclick="logout()">Sign Out</button>
      </div>`;
      } else {
        document.getElementById('sec-profile').innerHTML = `
      <div class="card" style="max-width:400px;margin:40px auto">
        <div style="display:flex;gap:8px;margin-bottom:16px">
          <button class="chip ${authTab === 'signup' ? 'active' : ''}" style="flex:1" onclick="setAuthTab('signup')">New User — Sign Up</button>
          <button class="chip ${authTab === 'login' ? 'active' : ''}" style="flex:1" onclick="setAuthTab('login')">Existing User — Log In</button>
        </div>
        <div id="authForm"></div>
      </div>`;
        renderAuthForm();
      }
    };
    window.setAuthTab = (t) => { authTab = t; render.profile(); };
    function renderAuthForm() {
      const el = document.getElementById('authForm');
      if (authTab === 'signup') {
        el.innerHTML = `
      <label>Name</label><input type="text" id="suName" style="margin-bottom:10px">
      <label>Email</label><input type="email" id="suEmail" style="margin-bottom:10px">
      <label>Password (min 6 characters)</label><input type="password" id="suPassword" style="margin-bottom:12px">
      <button class="btn" style="width:100%" onclick="doSignup()">Create Profile</button>
      <div class="tag" style="color:var(--pink);margin-top:8px" id="authErr"></div>`;
      } else {
        el.innerHTML = `
      <label>Email</label><input type="email" id="liEmail" style="margin-bottom:10px">
      <label>Password</label><input type="password" id="liPassword" style="margin-bottom:12px">
      <button class="btn" style="width:100%" onclick="doLogin()">Log In</button>
      <div class="tag" style="color:var(--pink);margin-top:8px" id="authErr"></div>`;
      }
    }
    window.doSignup = () => {
      const name = document.getElementById('suName').value.trim();
      const email = document.getElementById('suEmail').value.trim().toLowerCase();
      const password = document.getElementById('suPassword').value;
      const err = document.getElementById('authErr');
      if (!name || !email || !password) { err.textContent = 'All fields are required.'; return; }
      if (password.length < 6) { err.textContent = 'Password must be at least 6 characters.'; return; }
      if (ACCOUNTS[email]) { err.textContent = 'An account with this email already exists.'; return; }
      const user = {
        name, email, password, totalWorkouts: 0, activePlan: null,
        fitnessLevel: 'beginner', conditions: [], history: [],
        stats: { heartRate: 0, caloriesBurned: 0, exerciseMin: 0, exerciseGoal: 45, streakDays: 0, streakLabel: 'No streak yet' },
        consistency: [],
      };
      ACCOUNTS[email] = user;
      currentUser = user;
      toast('Welcome to Workout Wellness!');
      refreshNavUser();
      nav('dashboard');
    };
    window.doLogin = () => {
      const email = document.getElementById('liEmail').value.trim().toLowerCase();
      const password = document.getElementById('liPassword').value;
      const err = document.getElementById('authErr');
      const acct = ACCOUNTS[email];
      if (!acct || acct.password !== password) { err.textContent = 'Invalid email or password.'; return; }
      currentUser = acct;
      toast('Welcome back!');
      refreshNavUser();
      nav('dashboard');
    };
    window.logout = () => {
      currentUser = null; session = null; clearInterval(timerInterval);
      refreshNavUser(); toast('Signed out'); nav('profile');
    };
    window.editProfile = () => {
      const name = prompt('Update name:', currentUser.name);
      if (!name) return;
      currentUser.name = name;
      toast('Profile updated');
      render.profile(); refreshNavUser();
    };

    nav('profile');
    setTimeout(() => renderAuthForm(), 0);
  </script>
</body>

</html>
